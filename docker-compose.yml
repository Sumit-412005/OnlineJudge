# One-command local stack for the Online Judge (MongoDB is external, e.g. Atlas).
#
#   1. Copy .env.example to .env  and paste your Atlas string into MONGODB_URL.
#   2. docker compose up --build
#
# Backend -> http://localhost:4000   Frontend -> http://localhost:3000
#
# All configuration is read from the ".env" file next to this file.

services:
  backend:
    build: ./BACKEND
    container_name: oj-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URL=${MONGODB_URL}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the React bundle at build time. The browser calls this URL,
        # so it must be reachable from the host (not the compose network name).
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:4000}
    container_name: oj-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
